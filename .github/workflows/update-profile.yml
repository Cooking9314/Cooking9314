name: Update Profile README
on:
  schedule:
    - cron: '0 0 * * *' # Каждый день в 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Update README 📝
        run: |
          # Генерируем текущую дату и время
          CURRENT_DATE=$(date '+%d.%m.%Y %H:%M:%S UTC')
          
          # Массив цитат (можно добавить свои, связанные с геймдевом)
          QUOTES=(
            "Make it work, make it right, make it fast."
            "Code is like humor. When you have to explain it, it’s bad."
            "Game development is 10% inspiration and 90% debugging."
            "Simplicity is the soul of efficiency."
          )
          RANDOM_QUOTE=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          
          # Заменяем маркеры в README.md
          sed -i "s/<!-- LAST_UPDATED -->/Последнее обновление профиля: 🕒 **${CURRENT_DATE}**/" README.md
          sed -i "s/<!-- DAILY_QUOTE -->/💡 *${RANDOM_QUOTE}*/" README.md

      - name: Commit and Push 🚀
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update profile README" || echo "No changes to commit"
          git push