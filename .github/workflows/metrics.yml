name: Metrics Profile
on:
  schedule: [{cron: "0 0 * * *"}] # Обновление раз в день
  workflow_dispatch: # Ручной запуск
  push: {branches: ["main", "master"]} # Обновление при пуше

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Cooking9314
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          
          # Базовые плагины, которые работают стабильно без дополнительных токенов
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          
          # Если хочешь показать конкретные репозитории, раскомментируй строки ниже 
          # и замени 'owner/repo' на реальный путь к твоему проекту (например, 'Cooking9314/Sunrise-Studios')
          # plugin_repositories: yes
          # plugin_repositories_limit: 2
          # plugin_repositories_featured: Cooking9314/your-repo-name