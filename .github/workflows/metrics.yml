name: Metrics Profile
on:
  schedule: [{cron: "0 0 * * *"}] # Обновляется раз в день в полночь
  workflow_dispatch: # Позволяет запустить вручную во вкладке Actions
  push: {branches: ["main", "master"]} # Обновляется при пуше в основную ветку

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Cooking9314
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow # Или твой часовой пояс
          
          # Плагины для детализации
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8 # Показать топ-8 языков
          plugin_languages_colors: github
          
          # Дополнительно: можно включить отображение звезд и форков
          plugin_repositories: yes
          plugin_repositories_limit: 4
          plugin_repositories_featured: Sunrise-Studios/your-game-repo # Замени на свой реальный репозиторий